# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level — do NOT nest keys under an
# `agent:` block (that shape is invisible to the registry). Runtime parameters
# (max_retry, timeout_seconds) are configured in config/config.yaml — a runtime
# artifact added at Stage ③ — which AgentRegistry loads separately and passes as
# Graph(config=...).
id: "ENE-C2-142"
name: "Municipal Energy-Scenario Input Evidence Extractor"
namespace: "ene-c2-142"
version: "0.1.0"
enabled: true
category: "Cat 2"
industry: "ENE"

# Level 2 base agent type — L1-direct (AgentBaseGraph); no L2 base agent used
base_type: "Other"

# Entry point — single dotted import path (module.Class). AgentRegistry does
# manifest["class"].rsplit(".", 1) to get (module, class_name). The class is
# defined in src/graph/graph.py and re-exported from src/graph/__init__.py at
# Stage ③ implementation.
class: "src.graph.graph.MunicipalEnergyScenarioInputEvidenceExtractorGraph"

# Security
required_trust_level: "VERIFIED_EXTERNAL"

# Compile-time gates — declare every secret/extra actually used. The deterministic
# core needs neither: inputs are caller-supplied approved extracts, and there is no
# LLM on the core path.
requires:
  secrets: []
  extras: []
